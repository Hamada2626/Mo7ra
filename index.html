<style>
/* إضافات عدادات الذكريات */
.memory-old-counter{display:none!important}
.memory-years{
  font-size:clamp(34px,9vw,46px);
  font-weight:800;
  color:#ffd0f2;
  text-shadow:0 0 15px #f36bdf99;
  direction:rtl;
  margin:8px 0;
}
.memory-new-units{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin-top:10px;
  padding-top:9px;
  border-top:1px solid #d69aff44;
}
.memory-new-unit{
  font-size:12px;
  color:#ead9f7;
  white-space:nowrap;
}
.memory-new-unit b{
  display:block;
  font-size:17px;
  color:#f7c9ff;
  margin-bottom:2px;
}
</style>

<script>
(()=>{
  // تغيير اسم الوزة إلى المهرة في كل نصوص الموقع
  document.title="رسالة النهارده لمهرتي ❤️";

  function fixText(text){
    return text
      .replace(/أنا وزه/g,"أنا مهرتك")
      .replace(/أنا وزة/g,"أنا مهرتك")
      .replace(/وزة قلبي/g,"مهرة قلبي")
      .replace(/وزتي/g,"مهرتي")
      .replace(/يا وزة/g,"يا مهرتي")
      .replace(/أجمل وزة/g,"أجمل مهرة")
      .replace(/وزة/g,"مهرة")
      .replace(/🪿|🐥/g,"🐴");
  }

  function updateTexts(){
    const walker=document.createTreeWalker(
      document.body,
      NodeFilter.SHOW_TEXT
    );
    const nodes=[];
    while(walker.nextNode()){
      const node=walker.currentNode;
      if(node.parentElement &&
        !["SCRIPT","STYLE"].includes(node.parentElement.tagName)){
        nodes.push(node);
      }
    }
    nodes.forEach(node=>{
      const updated=fixText(node.nodeValue);
      if(updated!==node.nodeValue)node.nodeValue=updated;
    });
  }

  updateTexts();

  const textObserver=new MutationObserver(updateTexts);
  textObserver.observe(document.body,{
    childList:true,
    characterData:true,
    subtree:true
  });

  // تحديث عنوان ورسائل الموقع
  const mainTitle=document.querySelector("#messagesPage h1");
  if(mainTitle)mainTitle.textContent="مهرتي، يا أجمل حاجة في دنيتي";

  const introTitle=document.querySelector("#introScreen h2");
  if(introTitle)introTitle.textContent="يا مهرتي الجميلة ❤️";

  const introAnimal=document.querySelector(".intro-goose");
  if(introAnimal)introAnimal.textContent="🐴";

  // عدادات الذكريات بالتواريخ الصحيحة
  const memories=[
    {
      prefix:"memoryYou",
      date:new Date(2024,3,10,16,0,0),
      label:"♥ أول مرة شوفتك",
      dateText:"10 أبريل 2024 · 4:00 مساءً"
    },
    {
      prefix:"memoryI",
      date:new Date(2026,6,11,23,0,0),
      label:"✉ أول مرة كلمتك",
      dateText:"11 يوليو 2026 · 11:00 مساءً"
    }
  ];

  function addMonths(date,months){
    const result=new Date(date);
    const day=result.getDate();
    result.setDate(1);
    result.setMonth(result.getMonth()+months);
    const lastDay=new Date(
      result.getFullYear(),
      result.getMonth()+1,
      0
    ).getDate();
    result.setDate(Math.min(day,lastDay));
    return result;
  }

  function calendarDifference(start,end){
    let years=end.getFullYear()-start.getFullYear();
    let cursor=addMonths(start,years*12);

    if(cursor>end){
      years--;
      cursor=addMonths(start,years*12);
    }

    let months=0;
    while(months<11){
      const next=addMonths(cursor,1);
      if(next>end)break;
      cursor=next;
      months++;
    }

    let remaining=Math.max(0,end-cursor);
    const days=Math.floor(remaining/86400000);
    remaining-=days*86400000;

    const hours=Math.floor(remaining/3600000);
    remaining-=hours*3600000;

    const minutes=Math.floor(remaining/60000);
    remaining-=minutes*60000;

    const seconds=Math.floor(remaining/1000);

    return {years,months,days,hours,minutes,seconds};
  }

  function createMemoryLayout(item){
    const oldDays=document.getElementById(item.prefix+"Days");
    if(!oldDays)return;

    const article=oldDays.closest(".memory-counter");
    if(!article)return;

    article.querySelector(".memory-label").textContent=item.label;
    article.querySelector(".memory-date").textContent=item.dateText;

    oldDays.classList.add("memory-old-counter");

    const oldUnits=article.querySelector(".memory-units");
    if(oldUnits)oldUnits.classList.add("memory-old-counter");

    const main=document.createElement("div");
    main.className="memory-years";
    main.id=item.prefix+"CalendarYears";

    const units=document.createElement("div");
    units.className="memory-new-units";

    ["Months","Days","Hours","Minutes","Seconds"].forEach(unit=>{
      const cell=document.createElement("div");
      cell.className="memory-new-unit";
      cell.innerHTML='<b id="'+item.prefix+unit+'">00</b>'+unit;
      units.appendChild(cell);
    });

    oldDays.after(main,units);
  }

  memories.forEach(createMemoryLayout);

  function updateMemoryCounters(){
    const now=new Date();

    memories.forEach(item=>{
      const d=calendarDifference(item.date,now);

      const main=document.getElementById(
        item.prefix+"CalendarYears"
      );

      if(main){
        main.textContent=d.years.toLocaleString("en-US")+" Years";
      }

      ["Months","Days","Hours","Minutes","Seconds"].forEach(unit=>{
        const key=unit.toLowerCase();
        const el=document.getElementById(item.prefix+unit);
        if(el)el.textContent=String(d[key]).padStart(2,"0");
      });
    });
  }

  updateMemoryCounters();
  setInterval(updateMemoryCounters,1000);

  // تصحيح عدد تحديات العجلة بدل الرقم الثابت 50
  const challengeTotal=wheelChallenges.reduce(
    (sum,category)=>sum+category.items.filter(
      item=>typeof item==="string"&&item.trim()
    ).length,0
  );

  function fixWheelCount(){
    document.querySelectorAll(".wheel-count,.wheel-status").forEach(el=>{
      el.textContent=el.textContent
        .replace(/من 50/g,"من "+challengeTotal)
        .replace(/الـ50/g,"الـ"+challengeTotal);
    });
  }

  fixWheelCount();
  setInterval(fixWheelCount,1000);

})();
</script>
